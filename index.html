<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People | Boston Open Dev</title>
    <meta name="description" content="Meet the people of Boston Open Dev, a Boston-area meetup for open source developers. Find members on GitHub and Zulip." />
    <link rel="canonical" href="https://bostonopen.dev/people/" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boston Open Dev" />
    <meta property="og:title" content="People | Boston Open Dev" />
    <meta property="og:description" content="Meet the people of Boston Open Dev, a Boston-area meetup for open source developers." />
    <meta property="og:url" content="https://bostonopen.dev/people/" />
    <meta property="og:image" content="https://bostonopen.dev/images/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "People | Boston Open Dev",
      "url": "https://bostonopen.dev/people/",
      "isPartOf": { "@type": "WebSite", "name": "Boston Open Dev", "url": "https://bostonopen.dev/" }
    }
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#people">Skip to people</a>
    <header class="site-header">
      <nav aria-label="Breadcrumb">
        <a href="../../">Boston Open Dev</a>
        <span aria-hidden="true">/</span>
        <a href="../people/" aria-current="page">People</a>
      </nav>
      <h1>People</h1>
      <p class="intro">Folks who have come to a Boston Open Dev meetup. <a href="https://github.com/bostonopen/people">Add yourself</a>.</p>
    </header>
    <main>
      <template id="person-template">
        <li class="person-card">
          <a href="" class="avatar-href">
            <img src="" class="imagesrc" alt="" width="160" height="160" loading="lazy" decoding="async" />
            <span class="github-username person-name"></span>
          </a>
          <ul class="links">
            <li class="github">
              <a href="" class="github-href" rel="noopener">
                <img src="images/github.svg" width="16" height="16" alt="" /><span>GitHub</span>
              </a>
            </li>
            <li class="zulip">
              <a href="" class="zulip-href" rel="noopener">
                <img src="images/zulip.svg" width="16" height="16" alt="" /><span class="zulip-id"></span>
              </a>
            </li>
          </ul>
        </li>
      </template>
      <ul id="people" class="people-grid" aria-label="People"></ul>
    </main>
  </body>
</html>
